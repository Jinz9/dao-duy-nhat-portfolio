name: Build Website to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Initialize Capacitor
        run: |
          mkdir -p www
          # Copy toàn bộ file web (trừ thư mục ẩn và www) vào thư mục www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyPortfolio" "com.nhat.portfolio" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-apk
          path: android/app/build/outputs/apk/debug/*.apk
